<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ PIXEL CLASH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #bc13fe;
            --neon-green: #0aff0a;
            --dark-bg: #050510;
        }
        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            touch-action: manipulation;
            user-select: none;
        }
        .pixel-font { font-family: 'Press Start 2P', cursive; }
        
        /* CRT Scanline Effect */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        
        /* Neon Glows */
        .neon-box {
            box-shadow: 0 0 10px var(--neon-blue), inset 0 0 5px var(--neon-blue);
            border: 2px solid var(--neon-blue);
        }
        .neon-text { text-shadow: 0 0 5px var(--neon-blue); }
        .neon-pink { border-color: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }
        .neon-green { border-color: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }

        /* Grid Items */
        .game-card {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .game-card:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 0 20px var(--neon-pink);
            z-index: 10;
        }
        .game-card:hover .play-overlay { opacity: 1; }
        
        .play-overlay {
            background: rgba(0,0,0,0.7);
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* Canvas Container */
        #game-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.95);
            z-index: 50;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            background: #000;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            max-width: 100%;
            max-height: 80vh;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 4px; }
    </style>
</head>
<body class="crt min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="flex justify-between items-center p-4 border-b-2 border-cyan-500 bg-opacity-80 bg-black backdrop-blur-sm sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-cyan-500 animate-pulse rounded-sm"></div>
            <h1 class="pixel-font text-xl md:text-2xl text-cyan-400 neon-text">PIXEL CLASH</h1>
        </div>
        <button id="sound-toggle" class="pixel-font text-xs border-2 border-green-500 px-4 py-2 hover:bg-green-500 hover:text-black transition-colors rounded">
            SOUND: ON
        </button>
    </nav>

    <!-- Main Grid -->
    <main class="flex-grow p-4 md:p-8 container mx-auto">
        <div class="text-center mb-8">
            <h2 class="text-3xl md:text-5xl font-bold mb-2 text-white">SELECT YOUR GLITCH</h2>
            <p class="text-gray-400 pixel-font text-xs md:text-sm">10 JUEGOS ORIGINALES - SOLO EL MEJOR SOBREVIVE</p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 md:gap-6" id="game-grid">
            <!-- Cards generated by JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-4 text-center text-gray-500 text-sm border-t border-gray-800 mt-8">
        <p>PIXEL CLASH ⚡</p>
    </footer>

    <!-- Game Modal & Canvas -->
    <div id="game-modal">
        <div class="w-full max-w-4xl flex justify-between items-center px-4 mb-2 text-white">
            <h2 id="modal-title" class="pixel-font text-yellow-400 text-lg">GAME TITLE</h2>
            <div class="flex gap-4">
                <span id="score-display" class="pixel-font text-white">SCORE: 0</span>
                <button onclick="closeGame()" class="text-red-500 font-bold pixel-font hover:text-red-400">EXIT [X]</button>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="600" class="rounded border-2 border-gray-700"></canvas>
        <div class="mt-4 text-center text-gray-400 text-sm pixel-font hidden md:block" id="controls-hint">
            CONTROLS: ARROW KEYS / SPACE
        </div>
         <div class="mt-4 text-center text-gray-400 text-sm pixel-font md:hidden" id="mobile-hint">
            TAP SIDES OR BUTTONS TO PLAY
        </div>
        <!-- Mobile Controls (Dynamic visibility) -->
        <div id="mobile-controls" class="w-full max-w-lg mt-2 flex justify-between px-8 md:hidden h-16 select-none touch-none">
            <!-- Injected via JS based on game type -->
        </div>
    </div>

    <script>
        // --- 1. GAME DATA & CONFIGURATION ---
        const games = [
            { id: 'jump', name: 'NEON JUMPER', type: 'Platformer', color: 'border-cyan-500', icon: '🏃‍♂️', desc: 'Salta los picos de datos' },
            { id: 'shoot', name: 'CYBER DEFENSE', type: 'Shooter', color: 'border-red-500', icon: '🔫', desc: 'Destruye los Data Wasps' },
            { id: 'puzzle', name: 'LOGIC LOCK', type: 'Puzzle', color: 'border-yellow-500', icon: '🧠', desc: 'Memoriza el patrón' },
            { id: 'runner', name: 'GRID RUNNER', type: 'Arcade', color: 'border-purple-500', icon: '🏎️', desc: 'Esquiva obstáculos' },
            { id: 'race', name: 'VECTOR RACE', type: 'Racing', color: 'border-green-500', icon: '🏁', desc: 'Velocidad máxima' },
            { id: 'survive', name: 'VIRUS SURVIVAL', type: 'Survival', color: 'border-pink-500', icon: '🦠', desc: 'Huye de los Malware' },
            { id: 'click', name: 'BIT MINER', type: 'Clicker', color: 'border-blue-500', icon: '💎', desc: 'Mina cripto-pixeles' },
            { id: 'pong', name: 'PONG 2077', type: 'Arcade', color: 'border-white', icon: '🏓', desc: 'Tenis contra la IA' },
            { id: 'flappy', name: 'GRAVITY GLITCH', type: 'Skill', color: 'border-orange-500', icon: '🦅', desc: 'No toques las torres' },
            { id: 'snake', name: 'SNAKE.EXE', type: 'Classic', color: 'border-emerald-500', icon: '🐍', desc: 'Come RAM y crece' }
        ];

        // --- 2. ENGINE CORE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameLoopId;
        let activeGame = null;
        let score = 0;
        let gameActive = false;
        let isMuted = false;
        let frames = 0;
        let highScore = 0;

        // Input State
        const keys = {};
        const mouse = { x: 0, y: 0, down: false };

        // Audio Synth
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (isMuted) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'shoot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'point') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        // UI Generation
        const grid = document.getElementById('game-grid');
        games.forEach(game => {
            const card = document.createElement('div');
            card.className = `game-card bg-gray-900 h-40 md:h-48 rounded-lg relative border-b-4 ${game.color} overflow-hidden group`;
            card.innerHTML = `
                <div class="absolute inset-0 flex flex-col items-center justify-center p-2">
                    <span class="text-4xl md:text-6xl mb-2 group-hover:scale-110 transition-transform">${game.icon}</span>
                    <h3 class="pixel-font text-xs md:text-sm text-center font-bold text-white z-10">${game.name}</h3>
                    <span class="text-xs text-gray-500 mt-1">${game.type}</span>
                </div>
                <div class="play-overlay absolute inset-0 flex items-center justify-center">
                    <span class="pixel-font text-green-400 text-lg blink">PLAY ></span>
                </div>
            `;
            card.onclick = () => launchGame(game.id);
            grid.appendChild(card);
        });

        document.getElementById('sound-toggle').onclick = function() {
            isMuted = !isMuted;
            this.innerText = isMuted ? "SOUND: OFF" : "SOUND: ON";
            this.className = isMuted ? 
                "pixel-font text-xs border-2 border-red-500 px-4 py-2 hover:bg-red-500 hover:text-white transition-colors rounded" : 
                "pixel-font text-xs border-2 border-green-500 px-4 py-2 hover:bg-green-500 hover:text-black transition-colors rounded";
        };

        // Input Listeners
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
        });
        canvas.addEventListener('mousedown', () => mouse.down = true);
        canvas.addEventListener('mouseup', () => mouse.down = false);
        
        // Touch Support Wrapper --gemini
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            mouse.x = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
            mouse.y = (e.touches[0].clientY - rect.top) * (canvas.height / rect.height);
            mouse.down = true;
            keys['Space'] = true; // Maps tap to jump/action
            keys['ArrowUp'] = true;
        }, {passive: false});
        
        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            mouse.down = false;
            keys['Space'] = false;
            keys['ArrowUp'] = false;
        });

        // --- 3. GAME LOGIC IMPLEMENTATIONS ---
        
        let gameState = {}; // Holds game specific variables

        function launchGame(id) {
            activeGame = id;
            gameActive = true;
            score = 0;
            frames = 0;
            gameState = {}; // Reset state
            document.getElementById('game-modal').style.display = 'flex';
            document.getElementById('modal-title').innerText = games.find(g => g.id === id).name;
            initGame(id);
            gameLoop();
        }

        function closeGame() {
            gameActive = false;
            cancelAnimationFrame(gameLoopId);
            document.getElementById('game-modal').style.display = 'none';
        }

        function gameOver(win = false) {
            gameActive = false;
            ctx.fillStyle = "rgba(0,0,0,0.8)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = win ? "#0f0" : "#f00";
            ctx.font = "40px 'Press Start 2P'";
            ctx.textAlign = "center";
            ctx.fillText(win ? "YOU WON" : "GAME OVER", canvas.width/2, canvas.height/2);
            ctx.font = "20px 'Press Start 2P'";
            ctx.fillStyle = "#fff";
            ctx.fillText(`SCORE: ${score}`, canvas.width/2, canvas.height/2 + 50);
            ctx.fillText("Click/Tap to Restart", canvas.width/2, canvas.height/2 + 100);
            playSound('hit');
            
            canvas.onclick = () => {
                canvas.onclick = null;
                launchGame(activeGame);
            };
        }

        function initGame(id) {
            const w = canvas.width;
            const h = canvas.height;
            
            if (id === 'jump') {
                gameState = {
                    player: { x: 100, y: 300, w: 30, h: 30, vy: 0, grounded: false },
                    obstacles: [],
                    gravity: 0.6,
                    speed: 5
                };
            } else if (id === 'shoot') {
                gameState = {
                    player: { x: w/2, y: h/2, angle: 0 },
                    bullets: [],
                    enemies: [],
                    spawnTimer: 0
                };
            } else if (id === 'puzzle') {
                gameState = {
                    sequence: [],
                    playerSequence: [],
                    showing: false,
                    timer: 0,
                    colors: ['#f00', '#0f0', '#00f', '#ff0'],
                    flash: -1
                };
                addToSequence();
            } else if (id === 'runner') {
                gameState = {
                    lane: 1, // 0, 1, 2
                    lanesX: [w/2 - 150, w/2, w/2 + 150],
                    obstacles: [],
                    speed: 5
                };
            } else if (id === 'race') {
                gameState = {
                    player: { x: w/2, speed: 0 },
                    road: [],
                    enemies: [],
                    distance: 0
                };
            } else if (id === 'survive') {
                gameState = {
                    player: { x: w/2, y: h/2 },
                    enemies: [],
                    speed: 4
                };
            } else if (id === 'click') {
                gameState = {
                    bits: 0,
                    autoMiners: 0,
                    clickValue: 1,
                    particles: []
                };
            } else if (id === 'pong') {
                gameState = {
                    paddleY: h/2,
                    ball: { x: w/2, y: h/2, vx: 5, vy: 3 },
                    aiY: h/2
                };
            } else if (id === 'flappy') {
                gameState = {
                    bird: { y: h/2, vy: 0 },
                    pipes: [],
                    gravity: 0.4
                };
            } else if (id === 'snake') {
                gameState = {
                    snake: [{x: 10, y: 10}],
                    food: {x: 15, y: 10},
                    dir: {x: 1, y: 0},
                    gridSize: 20
                };
            }
        }

        // --- PUZZLE HELPER ---
        function addToSequence() {
            gameState.sequence.push(Math.floor(Math.random() * 4));
            gameState.playerSequence = [];
            gameState.showing = true;
            gameState.timer = 60; // Delay before showing
            gameState.step = 0;
        }

        function gameLoop() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            frames++;
            document.getElementById('score-display').innerText = `SCORE: ${score}`;

            switch(activeGame) {
                case 'jump': updateJump(); break;
                case 'shoot': updateShoot(); break;
                case 'puzzle': updatePuzzle(); break;
                case 'runner': updateRunner(); break;
                case 'race': updateRace(); break;
                case 'survive': updateSurvive(); break;
                case 'click': updateClick(); break;
                case 'pong': updatePong(); break;
                case 'flappy': updateFlappy(); break;
                case 'snake': updateSnake(); break;
            }

            gameLoopId = requestAnimationFrame(gameLoop);
        }

        // ------------------ GAME IMPLEMENTATIONS ------------------

        // 1. NEON JUMPER (Platformer)
        function updateJump() {
            const p = gameState.player;
            
            // Physics
            p.vy += gameState.gravity;
            p.y += p.vy;
            
            // Floor
            if (p.y + p.h > 500) {
                p.y = 500 - p.h;
                p.vy = 0;
                p.grounded = true;
            } else {
                p.grounded = false;
            }

            // Jump
            if ((keys['Space'] || keys['ArrowUp'] || mouse.down) && p.grounded) {
                p.vy = -12;
                playSound('jump');
                mouse.down = false; // Prevent auto-jump hold
            }

            // Spawn Obstacles (Glitch Spikes)
            if (frames % 100 === 0) {
                gameState.obstacles.push({ x: canvas.width, w: 30, h: 40, type: Math.random() > 0.5 ? 1 : 0 }); // 0: floor, 1: flying
            }

            // Draw Floor
            ctx.fillStyle = '#0ff';
            ctx.fillRect(0, 500, canvas.width, 4);

            // Draw Player
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#0ff';
            ctx.fillStyle = '#fff';
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.shadowBlur = 0;

            // Handle Obstacles
            for (let i = gameState.obstacles.length - 1; i >= 0; i--) {
                let ob = gameState.obstacles[i];
                ob.x -= gameState.speed;
                
                let obY = ob.type === 0 ? 460 : 380;
                
                // Draw Obstacle (Triangles or Blocks)
                ctx.fillStyle = '#f0f';
                if (ob.type === 0) {
                    ctx.beginPath();
                    ctx.moveTo(ob.x, 500);
                    ctx.lineTo(ob.x + 15, 460);
                    ctx.lineTo(ob.x + 30, 500);
                    ctx.fill();
                } else {
                    ctx.fillRect(ob.x, obY, ob.w, 20);
                }

                // Collision
                if (p.x < ob.x + ob.w && p.x + p.w > ob.x && p.y < (ob.type === 0 ? 500 : 400) && p.y + p.h > obY) {
                    gameOver();
                }

                if (ob.x < -50) {
                    gameState.obstacles.splice(i, 1);
                    score += 10;
                    gameState.speed += 0.1;
                }
            }
        }

        // 2. CYBER DEFENSE (Shooter)
        function updateShoot() {
            const p = gameState.player;
            
            // Rotation
            let targetX = mouse.x;
            let targetY = mouse.y;
            p.angle = Math.atan2(targetY - p.y, targetX - p.x);

            // Shoot
            if ((mouse.down || keys['Space']) && frames % 10 === 0) {
                gameState.bullets.push({
                    x: p.x, y: p.y, 
                    vx: Math.cos(p.angle) * 10, 
                    vy: Math.sin(p.angle) * 10 
                });
                playSound('shoot');
            }

            // Draw Turret
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.fillStyle = '#0ff';
            ctx.fillRect(-15, -15, 30, 30);
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, -5, 40, 10);
            ctx.restore();

            // Bullets
            ctx.fillStyle = '#ff0';
            gameState.bullets.forEach((b, i) => {
                b.x += b.vx;
                b.y += b.vy;
                ctx.fillRect(b.x-2, b.y-2, 4, 4);
                if(b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) gameState.bullets.splice(i, 1);
            });

            // Enemies (Data Wasps)
            if (frames % 60 === 0) {
                let angle = Math.random() * Math.PI * 2;
                let r = 400;
                gameState.enemies.push({
                    x: p.x + Math.cos(angle) * r,
                    y: p.y + Math.sin(angle) * r,
                    speed: 1 + (score/1000)
                });
            }

            gameState.enemies.forEach((e, i) => {
                let angle = Math.atan2(p.y - e.y, p.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                // Draw Enemy (Hexagon)
                ctx.fillStyle = '#f00';
                ctx.beginPath();
                for(let j=0; j<6; j++) {
                    ctx.lineTo(e.x + 15 * Math.cos(j * Math.PI / 3), e.y + 15 * Math.sin(j * Math.PI / 3));
                }
                ctx.fill();

                // Collision Player
                if (Math.hypot(e.x - p.x, e.y - p.y) < 25) gameOver();

                // Collision Bullet
                gameState.bullets.forEach((b, j) => {
                    if (Math.hypot(e.x - b.x, e.y - b.y) < 15) {
                        gameState.enemies.splice(i, 1);
                        gameState.bullets.splice(j, 1);
                        score += 50;
                        playSound('hit');
                    }
                });
            });
        }

        // 3. LOGIC LOCK (Puzzle)
        function updatePuzzle() {
            // Draw 4 Pads
            const padSize = 100;
            const positions = [
                {x: 300, y: 200, color: '#f00'},
                {x: 420, y: 200, color: '#0f0'},
                {x: 300, y: 320, color: '#00f'},
                {x: 420, y: 320, color: '#ff0'}
            ];

            // Logic showing sequence
            if (gameState.showing) {
                if (gameState.timer > 0) {
                    gameState.timer--;
                } else {
                    gameState.flash = gameState.sequence[gameState.step];
                    playSound('point');
                    setTimeout(() => { gameState.flash = -1; }, 300);
                    
                    gameState.step++;
                    gameState.timer = 40; // pause between flashes

                    if (gameState.step >= gameState.sequence.length) {
                        gameState.showing = false;
                        gameState.flash = -1;
                        document.getElementById('modal-title').innerText = "YOUR TURN";
                    }
                }
            } else {
                 // Check Input
                 if (mouse.down) {
                    mouse.down = false;
                    for(let i=0; i<4; i++) {
                        let p = positions[i];
                        if (mouse.x > p.x && mouse.x < p.x + padSize && mouse.y > p.y && mouse.y < p.y + padSize) {
                            gameState.playerSequence.push(i);
                            gameState.flash = i;
                            playSound('point');
                            setTimeout(() => { gameState.flash = -1; }, 100);

                            // Validate
                            let idx = gameState.playerSequence.length - 1;
                            if (gameState.playerSequence[idx] !== gameState.sequence[idx]) {
                                gameOver();
                            } else {
                                if (gameState.playerSequence.length === gameState.sequence.length) {
                                    score += 100;
                                    setTimeout(addToSequence, 1000);
                                    document.getElementById('modal-title').innerText = "WATCH";
                                }
                            }
                        }
                    }
                 }
            }

            positions.forEach((pos, i) => {
                ctx.fillStyle = gameState.flash === i ? '#fff' : pos.color;
                ctx.shadowBlur = gameState.flash === i ? 20 : 0;
                ctx.shadowColor = pos.color;
                ctx.fillRect(pos.x, pos.y, padSize, padSize);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(pos.x, pos.y, padSize, padSize);
            });
        }

        // 4. GRID RUNNER (Arcade)
        function updateRunner() {
            // Controls
            if (keys['ArrowLeft'] && !keys.lastLeft) { gameState.lane = Math.max(0, gameState.lane - 1); keys.lastLeft = true; }
            if (!keys['ArrowLeft']) keys.lastLeft = false;
            
            if (keys['ArrowRight'] && !keys.lastRight) { gameState.lane = Math.min(2, gameState.lane + 1); keys.lastRight = true; }
            if (!keys['ArrowRight']) keys.lastRight = false;

            // Touch support simplified
            if (mouse.down) {
                 if (mouse.x < canvas.width/2 && !keys.lastLeft) { gameState.lane = Math.max(0, gameState.lane - 1); keys.lastLeft = true; }
                 if (mouse.x > canvas.width/2 && !keys.lastRight) { gameState.lane = Math.min(2, gameState.lane + 1); keys.lastRight = true; }
                 mouse.down = false; // Trigger once
                 setTimeout(() => { keys.lastLeft=false; keys.lastRight=false; }, 200);
            }

            // Draw Lanes
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 5;
            gameState.lanesX.forEach(x => {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            });

            // Player
            let px = gameState.lanesX[gameState.lane];
            let py = canvas.height - 100;
            ctx.fillStyle = '#0ff';
            ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px-20, py+40); ctx.lineTo(px+20, py+40); ctx.fill();

            // Obstacles
            if (frames % 40 === 0) {
                let l = Math.floor(Math.random() * 3);
                gameState.obstacles.push({ lane: l, y: -50 });
            }

            gameState.obstacles.forEach((ob, i) => {
                ob.y += gameState.speed + (score/500);
                
                let ox = gameState.lanesX[ob.lane];
                ctx.fillStyle = '#f00';
                ctx.fillRect(ox - 20, ob.y, 40, 40);

                // Collision
                if (ob.lane === gameState.lane && ob.y > py - 40 && ob.y < py + 40) gameOver();
                if (ob.y > canvas.height) {
                    gameState.obstacles.splice(i, 1);
                    score += 10;
                }
            });
        }

        // 5. VECTOR RACE (Racing)
        function updateRace() {
            const p = gameState.player;
            
            // Movement
            if (keys['ArrowLeft']) p.x -= 5;
            if (keys['ArrowRight']) p.x += 5;
            // Mouse/Touch follow x
            if (mouse.down) {
                 p.x += (mouse.x - p.x) * 0.1;
            }

            // Boundary
            if (p.x < 200) p.x = 200;
            if (p.x > 600) p.x = 600;

            // Road generation (pseudo 3d lines)
            ctx.fillStyle = '#111';
            ctx.fillRect(200, 0, 400, 600);
            ctx.strokeStyle = '#0f0';
            ctx.beginPath(); ctx.moveTo(200, 0); ctx.lineTo(200, 600); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(600, 0); ctx.lineTo(600, 600); ctx.stroke();

            // Moving Grid
            gameState.distance += 5 + score/100;
            let offset = gameState.distance % 50;
            for(let y = offset; y < 600; y+=50) {
                ctx.fillStyle = 'rgba(0, 255, 0, 0.2)';
                ctx.fillRect(200, y, 400, 2);
            }

            // Player Car
            ctx.fillStyle = '#0ff';
            ctx.fillRect(p.x - 15, 500, 30, 50);

            // Enemies (Traffic)
            if (frames % 60 === 0) {
                gameState.enemies.push({ x: 220 + Math.random() * 360, y: -50, speed: 2 + Math.random() * 3 });
            }

            gameState.enemies.forEach((e, i) => {
                e.y += 5 + score/100 - e.speed; // Relative speed
                ctx.fillStyle = '#f00';
                ctx.fillRect(e.x - 15, e.y, 30, 50);

                if (Math.abs(e.x - p.x) < 30 && Math.abs(e.y - 500) < 50) gameOver();
                
                if (e.y > 650) {
                    gameState.enemies.splice(i, 1);
                    score += 10;
                }
            });
        }

        // 6. VIRUS SURVIVAL (Survival)
        function updateSurvive() {
            const p = gameState.player;
            // Move
            if (keys['ArrowUp']) p.y -= gameState.speed;
            if (keys['ArrowDown']) p.y += gameState.speed;
            if (keys['ArrowLeft']) p.x -= gameState.speed;
            if (keys['ArrowRight']) p.x += gameState.speed;
            
            // Touch follow
            if (mouse.down) {
                 let angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);
                 p.x += Math.cos(angle) * gameState.speed;
                 p.y += Math.sin(angle) * gameState.speed;
            }

            // Keep in bounds
            p.x = Math.max(10, Math.min(canvas.width-10, p.x));
            p.y = Math.max(10, Math.min(canvas.height-10, p.y));

            // Player Dot
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.fill();
            // Pulse ring
            ctx.strokeStyle = `rgba(0, 255, 255, ${Math.abs(Math.sin(frames/10))})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, Math.PI*2); ctx.stroke();

            score++;

            // Enemies
            if (frames % 30 === 0) {
                let side = Math.floor(Math.random()*4);
                let ex, ey;
                if (side===0) { ex=Math.random()*canvas.width; ey=-20; }
                else if (side===1) { ex=canvas.width+20; ey=Math.random()*canvas.height; }
                else if (side===2) { ex=Math.random()*canvas.width; ey=canvas.height+20; }
                else { ex=-20; ey=Math.random()*canvas.height; }
                
                gameState.enemies.push({x: ex, y: ey, vx: 0, vy: 0});
            }

            gameState.enemies.forEach(e => {
                // Seek logic
                let angle = Math.atan2(p.y - e.y, p.x - e.x);
                e.x += Math.cos(angle) * 2;
                e.y += Math.sin(angle) * 2;

                ctx.fillStyle = '#0f0';
                ctx.fillText('☠', e.x-5, e.y+5);

                if (Math.hypot(e.x - p.x, e.y - p.y) < 15) gameOver();
            });
        }

        // 7. BIT MINER (Clicker)
        function updateClick() {
            // Background Animation
            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,canvas.width, canvas.height);
            
            // Big Button in Middle
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, 80, 0, Math.PI*2);
            ctx.fillStyle = mouse.down && Math.hypot(mouse.x - canvas.width/2, mouse.y - canvas.height/2) < 80 ? '#00aaaa' : '#0ff';
            ctx.fill();
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#0ff';
            ctx.fillStyle = '#000';
            ctx.font = '20px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText("MINE", canvas.width/2, canvas.height/2 + 8);
            ctx.shadowBlur = 0;

            // Logic
            if (mouse.down && !keys.lastClick) {
                if (Math.hypot(mouse.x - canvas.width/2, mouse.y - canvas.height/2) < 80) {
                    score += gameState.clickValue;
                    playSound('point');
                    gameState.particles.push({x: mouse.x, y: mouse.y, life: 20, text: `+${gameState.clickValue}`});
                }
                keys.lastClick = true;
            }
            if (!mouse.down) keys.lastClick = false;

            // Auto mine
            if (frames % 60 === 0) {
                score += gameState.autoMiners;
            }

            // Upgrades UI
            ctx.fillStyle = '#fff';
            ctx.fillText(`BITS: ${score}`, canvas.width/2, 100);
            
            // Draw Upgrade Button 1
            ctx.strokeStyle = '#f0f';
            ctx.strokeRect(100, 500, 200, 50);
            ctx.fillText(`AUTO-MINER (100)`, 200, 535);
            
            // Draw Upgrade Button 2
            ctx.strokeStyle = '#ff0';
            ctx.strokeRect(500, 500, 200, 50);
            ctx.fillText(`POWER CLICK (500)`, 600, 535);

            // Handle Upgrade Clicks (Simplified regions)
            if (mouse.down && !keys.lastClick) {
                 if (mouse.y > 500 && mouse.y < 550) {
                     if (mouse.x > 100 && mouse.x < 300 && score >= 100) {
                         score -= 100; gameState.autoMiners++; playSound('jump');
                     }
                     if (mouse.x > 500 && mouse.x < 700 && score >= 500) {
                         score -= 500; gameState.clickValue++; playSound('jump');
                     }
                 }
                 keys.lastClick = true;
            }

            // Particles
            gameState.particles.forEach((p, i) => {
                p.y--;
                p.life--;
                ctx.fillStyle = '#fff';
                ctx.fillText(p.text, p.x, p.y);
                if (p.life <= 0) gameState.particles.splice(i, 1);
            });
        }

        // 8. PONG 2077
        function updatePong() {
            // Player Paddle
            gameState.paddleY = mouse.y - 40;
            // Touch fallback if no mouse move
            if (keys['ArrowUp']) gameState.paddleY -= 8;
            if (keys['ArrowDown']) gameState.paddleY += 8;

            ctx.fillStyle = '#fff';
            ctx.fillRect(20, gameState.paddleY, 10, 80);

            // AI Paddle
            let destY = gameState.ball.y - 40;
            gameState.aiY += (destY - gameState.aiY) * 0.1;
            ctx.fillRect(canvas.width - 30, gameState.aiY, 10, 80);

            // Ball
            let b = gameState.ball;
            b.x += b.vx;
            b.y += b.vy;

            ctx.fillRect(b.x-5, b.y-5, 10, 10);

            // Bounce Top/Bottom
            if (b.y < 0 || b.y > canvas.height) { b.vy *= -1; playSound('hit'); }

            // Bounce Paddles
            if (b.x < 30 && b.y > gameState.paddleY && b.y < gameState.paddleY + 80) {
                b.vx = Math.abs(b.vx) + 0.5;
                playSound('jump');
            }
            if (b.x > canvas.width - 30 && b.y > gameState.aiY && b.y < gameState.aiY + 80) {
                b.vx = -Math.abs(b.vx) - 0.5;
                playSound('jump');
            }

            // Score/Reset
            if (b.x < 0) gameOver(); // Lose
            if (b.x > canvas.width) {
                score++;
                b.x = canvas.width/2; b.y = canvas.height/2; b.vx = 5;
            }

            // Net
            ctx.setLineDash([10, 10]);
            ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke();
            ctx.setLineDash([]);
        }

        // 9. GRAVITY GLITCH (Flappy Style)
        function updateFlappy() {
            const b = gameState.bird;
            
            // Input
            if ((keys['Space'] || mouse.down) && !keys.lastFlap) {
                b.vy = -8;
                keys.lastFlap = true;
                playSound('jump');
            }
            if (!keys['Space'] && !mouse.down) keys.lastFlap = false;

            // Physics
            b.vy += gameState.gravity;
            b.y += b.vy;

            // Bird
            ctx.fillStyle = '#ff0';
            ctx.fillRect(100, b.y, 20, 20);

            // Pipes
            if (frames % 100 === 0) {
                let gap = 150;
                let topH = Math.random() * (canvas.height - gap - 50) + 20;
                gameState.pipes.push({ x: canvas.width, top: topH, gap: gap });
            }

            gameState.pipes.forEach((p, i) => {
                p.x -= 3;
                
                ctx.fillStyle = '#0f0';
                ctx.fillRect(p.x, 0, 50, p.top); // Top Pipe
                ctx.fillRect(p.x, p.top + p.gap, 50, canvas.height - (p.top + p.gap)); // Bottom Pipe

                // Collision
                if (120 > p.x && 100 < p.x + 50) {
                    if (b.y < p.top || b.y + 20 > p.top + p.gap) gameOver();
                }

                if (p.x < -50) {
                    gameState.pipes.splice(i, 1);
                    score++;
                }
            });

            if (b.y > canvas.height || b.y < 0) gameOver();
        }

        // 10. SNAKE.EXE
        function updateSnake() {
            if (frames % 5 !== 0) return; // Slow down update rate

            const head = { x: gameState.snake[0].x + gameState.dir.x, y: gameState.snake[0].y + gameState.dir.y };

            // Controls
            if (keys['ArrowUp'] && gameState.dir.y === 0) gameState.dir = {x: 0, y: -1};
            if (keys['ArrowDown'] && gameState.dir.y === 0) gameState.dir = {x: 0, y: 1};
            if (keys['ArrowLeft'] && gameState.dir.x === 0) gameState.dir = {x: -1, y: 0};
            if (keys['ArrowRight'] && gameState.dir.x === 0) gameState.dir = {x: 1, y: 0};
            
            // Touch Controls: Zones
            if (mouse.down) {
                let dx = mouse.x - canvas.width/2;
                let dy = mouse.y - canvas.height/2;
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0 && gameState.dir.x === 0) gameState.dir = {x:1, y:0};
                    if (dx < 0 && gameState.dir.x === 0) gameState.dir = {x:-1, y:0};
                } else {
                    if (dy > 0 && gameState.dir.y === 0) gameState.dir = {x:0, y:1};
                    if (dy < 0 && gameState.dir.y === 0) gameState.dir = {x:0, y:-1};
                }
            }

            // Wall Collision
            const cols = canvas.width / gameState.gridSize;
            const rows = canvas.height / gameState.gridSize;

            if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) gameOver();
            
            // Self Collision
            for(let part of gameState.snake) {
                if (head.x === part.x && head.y === part.y) gameOver();
            }

            gameState.snake.unshift(head);

            // Food
            if (head.x === gameState.food.x && head.y === gameState.food.y) {
                score += 10;
                playSound('point');
                gameState.food = {
                    x: Math.floor(Math.random() * cols),
                    y: Math.floor(Math.random() * rows)
                };
            } else {
                gameState.snake.pop();
            }

            // Draw
            ctx.fillStyle = '#0f0';
            gameState.snake.forEach(part => {
                ctx.fillRect(part.x * gameState.gridSize, part.y * gameState.gridSize, gameState.gridSize-2, gameState.gridSize-2);
            });

            ctx.fillStyle = '#f00';
            ctx.fillRect(gameState.food.x * gameState.gridSize, gameState.food.y * gameState.gridSize, gameState.gridSize-2, gameState.gridSize-2);
        }

    </script>
